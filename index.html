        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8f9fa;
      }
      
      #root:empty::after {
        content: '';
        width: 48px;
        height: 48px;
        border: 3px solid #e5e7eb;
        border-top-color: #3d4654;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Hide content until styles are loaded */
      #root:not(:empty) {
        opacity: 0;
        animation: fadeIn 0.3s ease-in forwards;
      }
      
      @keyframes fadeIn {
        to { opacity: 1; }
      }
      
      @media (prefers-color-scheme: dark) {
        #root:empty {
          background: #0f172a;
        }
        #root:empty::after {
          border-color: #334155;
          border-top-color: #3d4654;
        }
      }
