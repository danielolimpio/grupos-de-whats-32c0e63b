name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main
  schedule:
    # Roda diariamente às 06:00 UTC (03:00 BRT) — regenera HTMLs e sitemap a partir do Supabase
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite acionar manualmente pela aba Actions do GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Gerar FAQ SEO ampliada
        run: npm run seo:faq

      - name: Gerar páginas de categorias de cauda longa (SEO)
        run: node scripts/generate-longtail-categories.mjs

      - name: Pré-renderizar grupos (SSG dinâmico do Supabase)
        run: npm run prerender
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build do projeto
        run: npm run build

      - name: Mostrar arquivos gerados
        run: ls -la dist/

      - name: Instalar cliente FTP resiliente
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validar pacote antes do deploy
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/.htaccess
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -d dist/images
          grep -R "G-E57Y5PX83Q" dist/index.html dist/grupo dist/categoria >/dev/null

      - name: Deploy FTP resiliente para Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"

          # Estratégia em 3 fases para NUNCA deixar index.html apontando
          # para bundles /assets/*.js que ainda não subiram (causa da tela branca):
          #   Fase 1: subir /assets completo (bundles JS/CSS novos com hash).
          #   Fase 2: subir o restante do site EXCETO index.html.
          #   Fase 3: subir o index.html por último.
          # Removido --only-newer: comparar por tamanho evita pular arquivos
          # que ficaram truncados por timeout em execuções anteriores.
          run_lftp() {
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTP_CMDS
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set net:timeout 120
          set net:max-retries 5
          set net:reconnect-interval-base 15
          set net:reconnect-interval-multiplier 1
          set xfer:clobber on
          set mirror:use-pget-n 3
          set cmd:fail-exit no
          mkdir assets
          mkdir images
          set cmd:fail-exit yes
          $1
          bye
          LFTP_CMDS
          }

          FASE1='mirror --reverse --verbose --parallel=2 --no-perms --ignore-time --size-only --continue --delete ./dist/assets/ /assets/'
          FASE2='mirror --reverse --verbose --parallel=1 --no-perms --ignore-time --size-only --continue --exclude-glob index.html --exclude-glob assets/ ./dist/ /'
          FASE3='put -O / ./dist/index.html'

          for phase_name in "Fase 1 (assets)|$FASE1" "Fase 2 (páginas)|$FASE2" "Fase 3 (index.html)|$FASE3"; do
            label="${phase_name%%|*}"
            cmd="${phase_name#*|}"
            ok=0
            for attempt in 1 2 3; do
              echo ">>> $label — tentativa ${attempt}/3"
              if run_lftp "$cmd"; then
                echo ">>> $label concluída."
                ok=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                wait_seconds=$((attempt * 45))
                echo ">>> $label falhou; aguardando ${wait_seconds}s..."
                sleep "$wait_seconds"
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "!!! $label falhou após 3 tentativas."
              exit 1
            fi
          done

          echo "Deploy concluído com sucesso."
          exit 0
