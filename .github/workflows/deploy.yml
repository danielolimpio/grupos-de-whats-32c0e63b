name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main
  schedule:
    # Roda diariamente às 06:00 UTC (03:00 BRT) — regenera HTMLs e sitemap a partir do Supabase
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite acionar manualmente pela aba Actions do GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Gerar páginas de categorias de cauda longa (SEO)
        run: node scripts/generate-longtail-categories.mjs

      - name: Pré-renderizar grupos (SSG dinâmico do Supabase)
        run: npm run prerender
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build do projeto
        run: npm run build

      - name: Mostrar arquivos gerados
        run: ls -la dist/

      - name: Deploy FTP para Hostinger (tentativa 1)
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: false
          dry-run: false
          timeout: 300000
          log-level: standard

      - name: Aguardar antes de retentar
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy FTP para Hostinger (tentativa 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: false
          dry-run: false
          timeout: 300000
          log-level: standard

      - name: Aguardar antes da última tentativa
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy FTP para Hostinger (tentativa 3 - final)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: false
          dry-run: false
          timeout: 300000
          log-level: verbose
